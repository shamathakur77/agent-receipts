[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipts"
version = "0.1.0"
description = "Hash-chained, append-only audit trail for AI agent actions, mapped to GDPR and EU AI Act articles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shama Thakur" }]
keywords = ["ai-agents", "audit-trail", "gdpr", "eu-ai-act", "mcp", "compliance"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
receipts = "agent_receipts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
