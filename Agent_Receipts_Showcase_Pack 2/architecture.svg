<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Agent Receipts architecture</title>
  <desc id="d">An agent calls tools through a wrapper. The wrapper scrubs and hashes data, then appends a receipt to a hash-chained ledger. A CLI verifies and reports. A weekly GitHub Action runs synthetic agents and publishes a report. A static dashboard re-verifies the chain in the browser.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; rx: 10; }
      .hot { fill: #e6f4ec; stroke: #0a7d4f; stroke-width: 2; rx: 10; }
      .syn { fill: #fff3e0; stroke: #8a4b08; stroke-width: 1.5; rx: 10; }
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f2328; }
      .h { font-size: 15px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #3d4651; }
      .l { font-size: 12px; fill: #3d4651; }
      .arrow { stroke: #1f2328; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="900" height="430" fill="#f7f6f2"/>

  <rect class="box" x="20" y="40" width="170" height="80"/>
  <text class="h" x="105" y="72" text-anchor="middle">AI agent</text>
  <text class="s" x="105" y="94" text-anchor="middle">Python tool or MCP client</text>

  <rect class="box" x="235" y="40" width="200" height="80"/>
  <text class="h" x="335" y="72" text-anchor="middle">Wrapper</text>
  <text class="s" x="335" y="94" text-anchor="middle">receipted() or ReceiptedSession</text>

  <rect class="box" x="480" y="40" width="200" height="80"/>
  <text class="h" x="580" y="72" text-anchor="middle">Scrub and digest</text>
  <text class="s" x="580" y="94" text-anchor="middle">HMAC-SHA256, pseudonym</text>

  <rect class="hot" x="725" y="40" width="155" height="80"/>
  <text class="h" x="802" y="72" text-anchor="middle">ledger.jsonl</text>
  <text class="s" x="802" y="94" text-anchor="middle">each line hashes the last</text>

  <path class="arrow" d="M190 80 H233"/>
  <path class="arrow" d="M435 80 H478"/>
  <path class="arrow" d="M680 80 H723"/>
  <text class="l" x="105" y="142" text-anchor="middle">tool call</text>
  <text class="l" x="580" y="142" text-anchor="middle">raw arguments are dropped here</text>

  <rect class="box" x="725" y="190" width="155" height="80"/>
  <text class="h" x="802" y="222" text-anchor="middle">receipts CLI</text>
  <text class="s" x="802" y="244" text-anchor="middle">verify, report, prune</text>
  <path class="arrow" d="M802 120 V188"/>

  <rect class="syn" x="480" y="190" width="200" height="80"/>
  <text class="h" x="580" y="222" text-anchor="middle">Weekly GitHub Action</text>
  <text class="s" x="580" y="244" text-anchor="middle">synthetic agents only</text>
  <path class="arrow" d="M680 230 H723"/>
  <text class="l" x="580" y="290" text-anchor="middle">cron, issue on failure</text>

  <rect class="box" x="725" y="330" width="155" height="80"/>
  <text class="h" x="802" y="362" text-anchor="middle">Static dashboard</text>
  <text class="s" x="802" y="384" text-anchor="middle">re-verifies in the browser</text>
  <path class="arrow" d="M802 270 V328"/>
  <text class="l" x="812" y="305">report.json</text>

  <rect class="box" x="20" y="190" width="415" height="220"/>
  <text class="h" x="35" y="218">What a receipt holds</text>
  <text class="s" x="35" y="244">time, agent, run, tool, outcome</text>
  <text class="s" x="35" y="266">purpose and data categories</text>
  <text class="s" x="35" y="288">keyed pseudonym of the data subject</text>
  <text class="s" x="35" y="310">keyed digests of arguments and result</text>
  <text class="s" x="35" y="332">human oversight step, if any</text>
  <text class="s" x="35" y="354">retain_until date</text>
  <text class="s" x="35" y="376">hash of the previous receipt, own hash</text>
  <text class="h" x="35" y="400" style="fill:#0a7d4f">Never stored: raw arguments, raw results</text>
</svg>
